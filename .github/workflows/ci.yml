name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Ruff
        run: |
          pip install ruff==0.8.6
          ruff check --output-format=github .

      - name: Sintaxis del frontend
        run: for file in app/web/*.js; do node --check "$file"; done

      - name: docker-compose.yml válido
        run: docker compose --profile test config --quiet

  tests:
    name: Pruebas
    runs-on: ubuntu-latest
    env:
      TTS_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: Dependencias
        run: pip install -r requirements.txt -r tests/requirements.txt

      - name: Pytest
        run: pytest tests -v -p no:cacheprovider

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: voice-shop-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 -e DB_PATH=/tmp/assistant.db voice-shop-assistant:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/api/health && break
            sleep 2
          done
          curl -fs http://localhost:8000/api/health
          curl -fs -o /dev/null http://localhost:8000/
          curl -fs -o /dev/null http://localhost:8000/report
          curl -fs http://localhost:8000/api/stats | grep -q '"inventory"'

      - name: Logs del contenedor
        if: failure()
        run: docker logs app
