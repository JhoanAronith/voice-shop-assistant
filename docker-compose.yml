services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b-instruct}
    volumes:
      - ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama list | grep -q \"$$LLM_MODEL\" || ollama pull \"$$LLM_MODEL\""]
    restart: "no"

  app:
    build: .
    depends_on:
      model-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b-instruct}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_LANG: ${WHISPER_LANG:-es}
      DB_PATH: /data/assistant.db
      STORE_NAME: ${STORE_NAME:-TecnoStore}
      NOTIFY_URL: ${NOTIFY_URL:-}
      NOTIFY_CATEGORIES: ${NOTIFY_CATEGORIES:-reclamo}
    volumes:
      - ./data:/data
      - whisper:/models
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: ${TZ:-America/Lima}
      TZ: ${TZ:-America/Lima}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  tests:
    build: .
    profiles: ["test"]
    environment:
      TTS_ENABLED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./app:/app
      - ./tests:/tests
    command: sh -c "pip install -q -r /tests/requirements.txt && pytest /tests -q -p no:cacheprovider"

volumes:
  ollama:
  whisper:
  n8n_data:
