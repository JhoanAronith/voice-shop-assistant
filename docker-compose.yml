services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b-instruct}
    volumes:
      - ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama list | grep -q \"$$LLM_MODEL\" || ollama pull \"$$LLM_MODEL\""]
    restart: "no"

  app:
    build: .
    depends_on:
      model-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b-instruct}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_LANG: ${WHISPER_LANG:-es}
      DB_PATH: /data/assistant.db
      STORE_NAME: ${STORE_NAME:-TecnoStore}
    volumes:
      - ./data:/data
      - whisper:/models
    restart: unless-stopped

volumes:
  ollama:
  whisper:
